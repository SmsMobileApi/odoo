name: Validate Odoo add-on

on:
  push:
    branches: ["17.0"]
  pull_request:
    branches: ["17.0"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Marketplace package
        run: python scripts/validate_addon.py
